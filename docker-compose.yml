services:
  postgres:
    image: postgres:16-alpine
    container_name: jurisight_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       jurisight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jurisight"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Runtime dos modelos locais (embeddings nomic-embed-text + LLM de enriquecimento).
  # Alternativa ao Ollama nativo; escolha um dos dois — ambos usam a porta 11434.
  # O modelo é baixado dentro do container e persiste no volume ollama_models:
  #   docker compose exec ollama ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama
    container_name: jurisight_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  # Banco vetorial (substitui o ChromaDB embedded — ver README §Escalabilidade).
  # Vetores e grafo HNSW ficam em disco (mmap, on_disk=True em indexing/vector_store/
  # qdrant_store.py) em vez de forçar o índice inteiro em RAM.
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: jurisight_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  ollama_models:
  qdrant_data:
