services:
  postgres:
    image: postgres:16-alpine
    container_name: jurisight_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       jurisight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jurisight"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Runtime dos modelos locais (embeddings nomic-embed-text + LLM de enriquecimento).
  # Alternativa ao Ollama nativo; escolha um dos dois — ambos usam a porta 11434.
  # O modelo é baixado dentro do container e persiste no volume ollama_models:
  #   docker compose exec ollama ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama
    container_name: jurisight_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  postgres_data:
  ollama_models:
