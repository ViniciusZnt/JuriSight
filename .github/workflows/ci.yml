# CI: testes do backend e do front em todo PR e push.
# CD: em push na main, com os testes verdes, entra na VPS por SSH e atualiza o app.
# Secrets do repositório: VPS_HOST, VPS_USER, VPS_SSH_KEY (ver docs/deploy/2026-11-01-deploy-vps.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run pytest -q --cov --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://exemplo.invalid/api

  # Análise do SonarCloud (não bloqueia o deploy). Sem SONAR_TOKEN (secret ausente ou PR de fork), só avisa.
  sonar:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Confere o token
        id: token
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN ausente; análise do SonarCloud pulada."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.token.outputs.ok == 'true'
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: steps.token.outputs.ok == 'true'
        with:
          name: coverage-backend
      - uses: actions/download-artifact@v4
        if: steps.token.outputs.ok == 'true'
        with:
          name: coverage-frontend
          path: frontend/coverage
      - name: Caminhos do lcov relativos à raiz do repositório
        if: steps.token.outputs.ok == 'true'
        run: sed -i 's#^SF:src/#SF:frontend/src/#' frontend/coverage/lcov.info
      - uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        if: steps.token.outputs.ok == 'true'

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    steps:
      - name: Atualiza a VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "::warning::Secrets da VPS ainda não configurados; deploy pulado."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          # restart: o git pull troca Caddyfile/prometheus.yml por novos inodes e o Compose não recria o contêiner só por isso
          ssh -i ~/.ssh/deploy "$VPS_USER@$VPS_HOST" \
            'cd /opt/jurisight && git pull --ff-only && docker compose -f docker-compose.prod.yml up -d --build && docker compose -f docker-compose.prod.yml restart caddy prometheus && docker image prune -f'
