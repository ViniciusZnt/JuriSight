# CI: testes do backend e do front em todo PR e push.
# CD: em push na main, com os testes verdes, o runner self-hosted da VPS (label jurisight-producao)
# pega o job deploy e atualiza o app. O runner busca o job no GitHub por HTTPS: não há SSH de
# entrada nem chave no GitHub. Instalação: deploy/instalar-runner.sh e docs/deploy/2026-11-01-deploy-vps.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.13"
      # --no-build: só wheels prontos, sem rodar setup.py de dependência. O projeto em si não é
      # instalado (--no-install-project): os pacotes são importados da raiz do repositório.
      - run: uv sync --frozen --no-build --no-install-project
      - run: uv run --no-sync pytest -q --cov --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://exemplo.invalid/api

  # Análise do SonarCloud (não bloqueia o deploy). Sem SONAR_TOKEN (secret ausente ou PR de fork), só avisa.
  sonar:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Confere o token
        id: token
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN ausente; análise do SonarCloud pulada."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.token.outputs.ok == 'true'
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: steps.token.outputs.ok == 'true'
        with:
          name: coverage-backend
      - uses: actions/download-artifact@v4
        if: steps.token.outputs.ok == 'true'
        with:
          name: coverage-frontend
          path: frontend/coverage
      - name: Caminhos do lcov relativos à raiz do repositório
        if: steps.token.outputs.ok == 'true'
        run: sed -i 's#^SF:src/#SF:frontend/src/#' frontend/coverage/lcov.info
      - uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        if: steps.token.outputs.ok == 'true'

  # Só em push na main (nunca em PR): é o único job que roda no runner da VPS.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: [self-hosted, jurisight-producao]
    environment:
      name: producao
      url: https://jurisight.16-5-6-82.sslip.io
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    steps:
      # git pull, up -d --build, restart dos serviços com config montada e image prune.
      - name: Atualiza a produção
        run: /opt/jurisight/deploy/atualizar.sh
