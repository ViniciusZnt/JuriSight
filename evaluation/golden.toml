# ============================================================================
# Dataset golden — avaliação dos KPIs de recuperação (RFC §1.6, Tabela 3)
# ============================================================================
#
# COMO PREENCHER (idealmente com a especialista, ex.: Alexia):
#
#   1. Rode a busca de cada query (o run_eval.py imprime os top-10 de cada uma).
#   2. Olhe os documentos retornados e marque em `relevantes` os documento_id
#      (o UUID do Postgres) que DE FATO ajudam a tese da query.
#   3. Vale incluir documento_id que você SABE que existem e deveriam aparecer,
#      mesmo que a busca não os tenha trazido — é assim que P@K mede recall real.
#
# Enquanto `relevantes` estiver vazio, a query NÃO entra no Precision@K
# (o runner avisa quais faltam). As demais métricas (latência, provimento,
# citação, cobertura) rodam mesmo sem rótulos.
#
# `filtro` é opcional: aplica um where de metadados na busca. Use
# `filtro = { provimento = "APROVADO" }` nas queries que testam o KPI de
# "filtro por provimento" (o advogado pedindo só decisões favoráveis).
# ============================================================================

[[query]]
id = "q01"
query = "Adicional de insalubridade em grau máximo por exposição habitual a benzeno com EPI ineficaz"
filtro = { provimento = "APROVADO" }
relevantes = []

