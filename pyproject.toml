[project]
name = "jurisight"
version = "0.1.0"
description = "Jurisprudência scraper and search engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "chromadb>=1.5.9",
    "ollama>=0.6.2",
    "openai>=2.46.0",
    "playwright>=1.60.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
    "requests>=2.32",
    "stop-words>=2025.11.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scraper*", "processing*", "query*", "indexing*", "interface*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
