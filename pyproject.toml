[project]
name = "jurisight"
version = "0.1.0"
description = "Jurisprudência scraper and search engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "playwright>=1.58.0",
    "scrapy>=2.14.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scraper*", "processing*", "query*", "indexing*", "interface*"]