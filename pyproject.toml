[project]
name = "jurisight"
version = "0.1.0"
description = "Jurisprudência scraper and search engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "bm25s>=0.3.11",
    "fastapi>=0.115",
    "flashrank>=0.2.10",
    "ollama>=0.6.2",
    "openai>=2.46.0",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "playwright>=1.60.0",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.0",
    "pyjwt>=2.9",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.19.0",
    "requests>=2.32",
    "scipy>=1.14",
    "stop-words>=2025.11.4",
    "typesafe-sdk>=0.7.5",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scraper*", "processing*", "query*", "indexing*", "interface*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# Opcional: reranker monoPTT5 (S6) do benchmark. `uv sync --group benchmark`.
benchmark = [
    "torch",
    "transformers",
    "sentencepiece",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
